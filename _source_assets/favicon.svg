<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background: rounded teal square -->
  <rect width="64" height="64" rx="14" fill="#0D9668"/>
  <!-- Nest: protective bowl shape -->
  <path d="M14,40 Q14,50 32,50 Q50,50 50,40" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M18,42 Q18,47 32,47 Q46,47 46,42" fill="white" fill-opacity="0.15"/>
  <!-- Receipt/document nestled inside -->
  <g transform="translate(20,12)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="24" height="30" rx="3" fill="white" fill-opacity="0.2"/>
    <line x1="5" y1="8" x2="19" y2="8"/>
    <line x1="5" y1="14" x2="19" y2="14"/>
    <line x1="5" y1="20" x2="14" y2="20"/>
  </g>
  <!-- Small leaf accent -->
  <path d="M46,14 Q50,10 54,14 Q50,18 46,14 Z" fill="#34D399" opacity="0.9"/>
  <line x1="50" y1="14" x2="48" y2="17" stroke="#0D9668" stroke-width="1" stroke-linecap="round"/>
</svg>
